# Test battery on GitHub-hosted runners (public repository since 21/11/2026, spec 066: standard runners are free).
# Each suite runs on its own clean runner, in parallel; the whole battery takes as long as the slowest one.
# Runs on every pull request to dev/qa/master — documentation included, so "plan" and "static" can be required checks
# (a documentation-only change chooses nothing in seconds) — and on demand (Actions → Bateria → Run workflow). The plan
# job picks only the suites a change can break, to keep the wait short (pull requests to qa and master run everything).
name: Bateria

on:
  pull_request:
    branches: [dev, qa, master]
  workflow_dispatch:
    inputs:
      suites:
        description: "Suítes (separadas por espaço) ou 'all': static integration trails studio cluster chaos pgha install"
        default: all
        required: true

permissions:
  contents: read
  pull-requests: read      # plan: the files of the pull request
  actions: read            # plan: the jobs of the previous run
  checks: read             # plan: the suites the previous run chose (its notice)

# A new push to the same pull request cancels the run in progress (saves minutes).
concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      static: ${{ steps.p.outputs.static }}
      suites: ${{ steps.p.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: p
        env:
          WANT: ${{ github.event.inputs.suites || 'all' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Minutes are billed: each run takes only the suites the change can break (.github/battery-plan.sh).
          #  - pull request to qa or master: the whole battery (the gate before a release);
          #  - first run of a pull request to dev: the suites the files of the pull request touch;
          #  - a new push: the suites that did not pass in the previous run, plus the ones the files changed since then
          #    touch. Documentation alone on top of a green run runs nothing.
          #  - by hand (Actions → Bateria → Run workflow): the suites asked.
          all="integration trails studio cluster chaos pgha install"
          emit() {
            local static=false sel="" s
            for s in $1; do
              case " static $all " in *" $s "*) ;; *) echo "::error::suíte desconhecida: $s"; exit 1 ;; esac
              if [ "$s" = static ]; then static=true; else sel="$sel\"$s\","; fi
            done
            echo "static=$static" >> "$GITHUB_OUTPUT"
            echo "suites=[${sel%,}]" >> "$GITHUB_OUTPUT"
            echo "::notice::suítes desta execução: ${1:-nenhuma} — $2"
          }
          if [ "$EVENT" != pull_request ]; then
            [ "$WANT" = all ] && emit "static $all" "pedidas à mão" || emit "$WANT" "pedidas à mão"
            exit 0
          fi
          if [ "$BASE_REF" != dev ]; then
            emit "static $all" "pull request para $BASE_REF: bateria inteira"
            exit 0
          fi
          pr_files() { gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename'; }
          # The previous run of this pull request (any result), and the commit it tested.
          prev=$(gh api "repos/$REPO/actions/workflows/battery.yml/runs?branch=$HEAD_REF&event=pull_request&per_page=10" \
                   --jq "[.workflow_runs[] | select(.id != $RUN_ID)][0] | \"\(.id) \(.head_sha)\"" 2>/dev/null || true)
          prev_id=${prev%% *}; prev_sha=${prev##* }
          if [ "$ACTION" = synchronize ] && [ -n "$prev_id" ] && [ "$prev_id" != null ]; then
            jobs=$(gh api "repos/$REPO/actions/runs/$prev_id/jobs?per_page=100" \
                     --jq '.jobs[] | "\(.name)|\(.conclusion)|\(.id)"' 2>/dev/null || true)
            plan_id=$(printf '%s\n' "$jobs" | awk -F'|' '$1 == "plan" && $2 == "success" {print $3}')
            # What the previous run chose is in the notice of its plan; what passed, in its jobs.
            chosen=""
            if [ -n "$plan_id" ]; then
              chosen=$(gh api "repos/$REPO/check-runs/$plan_id/annotations" --jq '.[].message' 2>/dev/null \
                         | sed -nE 's/^suítes desta execução: (.*) — .*/\1/p' | head -1 || true)
            fi
            if [ -n "$chosen" ]; then
              passed=$(printf '%s\n' "$jobs" | awk -F'|' '$2 == "success" {print $1}' \
                         | sed -E 's/^suite \(([a-z]+)\)$/\1/' | tr '\n' ' ')
              redo=""
              for s in $chosen; do
                [ "$s" = nenhuma ] && continue
                case " $passed " in *" $s "*) ;; *) redo="$redo $s" ;; esac
              done
              files=$(gh api "repos/$REPO/compare/$prev_sha...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null || echo "?")
              if [ "$files" = "?" ] || [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then
                emit "static $all" "mudança grande ou histórico reescrito desde ${prev_sha:0:7}"
                exit 0
              fi
              touched=$(printf '%s\n' "$files" | .github/battery-plan.sh select)
              emit "$(printf '%s %s\n' "$redo" "$touched" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')" \
                   "repetidas da execução anterior:${redo:- nenhuma}; tocadas desde ${prev_sha:0:7}: ${touched:-nenhuma}"
              exit 0
            fi
          fi
          emit "$(pr_files | .github/battery-plan.sh select)" "pelos arquivos do pull request"

  # Compilation, dialyzer, eunit and the isolated Python runtime: no database needed.
  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: rebar3-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: rebar3-
      - name: Dialyzer
        run: docker run --rm -v "$PWD":/app -v "$HOME/.cache/rebar3":/root/.cache/rebar3 -w /app erlang:27 rebar3 dialyzer
      - name: EUnit
        run: docker run --rm -v "$PWD":/app -v "$HOME/.cache/rebar3":/root/.cache/rebar3 -w /app erlang:27 rebar3 eunit
      - name: Runtime Python
        run: make teste-runtime
      - name: Cache owned by the runner again
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/rebar3" || true

  # The suites only start after "static" passed (one minute): a compile or dialyzer error does not spend an hour.
  suite:
    needs: [plan, static]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.suites != '[]' &&
      (needs.static.result == 'success' || needs.static.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      # Standard runners keep only ~14 GB free; the stack (Citus, Erlang build, test data) needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/battery.yml
      - name: Python packages
        run: python -m pip install --quiet cryptography

      - name: Start ANA (database + core)
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do
            curl -fs -o /dev/null http://localhost:8080/health/live && exit 0
            sleep 3
          done
          docker compose logs --tail 200
          exit 1

      - name: Run ${{ matrix.suite }}
        run: |
          case "${{ matrix.suite }}" in
            integration) make teste-integracao ;;
            trails)      make teste-trilhas ;;
            studio)      make teste-estudio ;;
            cluster)     make teste-cluster ;;
            chaos)       make teste-caos ;;
            pgha)        make teste-pg-ha ;;
            install)     make teste-instalacao ;;
          esac

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          docker ps -a > logs/containers.txt
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs "$c" > "logs/$c.log" 2>&1 || true; done
          df -h > logs/disk.txt; free -m > logs/memory.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.suite }}
          path: logs/
          retention-days: 7

      - name: Stop
        if: always()
        run: docker compose down -v --remove-orphans || true
