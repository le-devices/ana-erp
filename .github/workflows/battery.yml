# Test battery on GitHub-hosted runners (private repository: billed minutes, free monthly quota).
# Each suite runs on its own clean runner, in parallel; the whole battery takes as long as the slowest one.
# Runs on pull requests to dev/qa/master and on demand (Actions → Bateria → Run workflow).
name: Bateria

on:
  pull_request:
    branches: [dev, qa, master]
    paths-ignore: ["specs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      suites:
        description: "Suítes (separadas por espaço) ou 'all': static integration trails studio cluster chaos pgha install"
        default: all
        required: true

permissions:
  contents: read

# A new push to the same pull request cancels the run in progress (saves minutes).
concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      static: ${{ steps.p.outputs.static }}
      suites: ${{ steps.p.outputs.suites }}
    steps:
      - id: p
        env:
          WANT: ${{ github.event.inputs.suites || 'all' }}
        run: |
          all="integration trails studio cluster chaos pgha install"
          [ "$WANT" = all ] && want="static $all" || want="$WANT"
          sel=""; static=false
          for s in $want; do
            case " static $all " in *" $s "*) ;; *) echo "::error::suíte desconhecida: $s"; exit 1 ;; esac
            if [ "$s" = static ]; then static=true; else sel="$sel\"$s\","; fi
          done
          echo "static=$static" >> "$GITHUB_OUTPUT"
          echo "suites=[${sel%,}]" >> "$GITHUB_OUTPUT"

  # Compilation, dialyzer, eunit and the isolated Python runtime: no database needed.
  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: rebar3-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: rebar3-
      - name: Dialyzer
        run: docker run --rm -v "$PWD":/app -v "$HOME/.cache/rebar3":/root/.cache/rebar3 -w /app erlang:27 rebar3 dialyzer
      - name: EUnit
        run: docker run --rm -v "$PWD":/app -v "$HOME/.cache/rebar3":/root/.cache/rebar3 -w /app erlang:27 rebar3 eunit
      - name: Runtime Python
        run: make teste-runtime
      - name: Cache owned by the runner again
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/rebar3" || true

  suite:
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      # Standard runners keep only ~14 GB free; the stack (Citus, Erlang build, test data) needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/battery.yml
      - name: Python packages
        run: python -m pip install --quiet cryptography

      - name: Start ANA (database + core)
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do
            curl -fs -o /dev/null http://localhost:8080/health/live && exit 0
            sleep 3
          done
          docker compose logs --tail 200
          exit 1

      - name: Run ${{ matrix.suite }}
        run: |
          case "${{ matrix.suite }}" in
            integration) make teste-integracao ;;
            trails)      make teste-trilhas ;;
            studio)      make teste-estudio ;;
            cluster)     make teste-cluster ;;
            chaos)       make teste-caos ;;
            pgha)        make teste-pg-ha ;;
            install)     make teste-instalacao ;;
          esac

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          docker ps -a > logs/containers.txt
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs "$c" > "logs/$c.log" 2>&1 || true; done
          df -h > logs/disk.txt; free -m > logs/memory.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.suite }}
          path: logs/
          retention-days: 7

      - name: Stop
        if: always()
        run: docker compose down -v --remove-orphans || true
