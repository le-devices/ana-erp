# Balancer for the chaos tests (spec 023, RF-023-01): routes only to ready nodes.
global
    maxconn 4096

defaults
    mode http
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    retries 3
    option redispatch
    retry-on conn-failure empty-response response-timeout
    option httpchk GET /health/ready
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend web
    bind :8090
    default_backend ana

backend ana
    balance roundrobin
    server ana1 ana:8080 check
    server ana2 ana2:8080 check
