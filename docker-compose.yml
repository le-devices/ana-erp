# ANA ERP — full environment: docker compose up --build
# Memory: ANA_PG_SHARED_BUFFERS / ANA_PG_EFFECTIVE_CACHE / ANA_PG_WORK_MEM (default for ~2 GB hosts)
name: ana-erp

# RF-025-07: bounded, rotated container logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-ana-env: &ana-env
  ANA_DB_HOST: ${ANA_DB_HOST:-db}
  ANA_DB_NAME: ana
  ANA_DB_USER: ana
  ANA_DB_PASSWORD: ${ANA_DB_PASSWORD:-ana_change_this_password}
  ANA_ADMIN_PASSWORD: ${ANA_ADMIN_PASSWORD:-admin}
  ANA_HTTP_PORT: "8080"
  ANA_DEMO: ${ANA_DEMO:-true}
  ANA_TIMEZONE: ${ANA_TIMEZONE:-America/Sao_Paulo}
  # Vault of connector secrets (spec 017): 32 bytes in base64, the same on every node.
  # The default is for development only; generate one with: openssl rand -base64 32
  ANA_MASTER_KEY: ${ANA_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS1jaGFuZ2UtbWUhISE=}

services:
  db:
    # PostgreSQL 16 with the Citus columnar extension (spec 007, RF-007-06).
    image: citusdata/citus:12.1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_change_this_password}
      ANA_DB_PASSWORD: ${ANA_DB_PASSWORD:-ana_change_this_password}
    # RNF-007-04: work in memory as much as possible; size to the host.
    # RF-025-07 (SSD): compressed WAL, spaced checkpoints, prewarm list saved
    # only at shutdown. fsync / full_page_writes / synchronous_commit stay on.
    command: >
      postgres -c shared_preload_libraries=citus,pg_prewarm
               -c pg_prewarm.autoprewarm=on
               -c shared_buffers=${ANA_PG_SHARED_BUFFERS:-512MB}
               -c effective_cache_size=${ANA_PG_EFFECTIVE_CACHE:-1536MB}
               -c work_mem=${ANA_PG_WORK_MEM:-32MB}
               -c maintenance_work_mem=256MB
               -c jit=on
               -c max_connections=300
               -c log_min_duration_statement=1000
               -c password_encryption=scram-sha-256
               -c wal_compression=lz4
               -c checkpoint_timeout=15min
               -c max_wal_size=2GB
               -c min_wal_size=256MB
               -c pg_prewarm.autoprewarm_interval=0
    volumes:
      - data:/var/lib/postgresql/data
      # RF-023-06: WAL archive and base backups (scripts/backup.sh); empty until enabled.
      - wal_archive:/var/lib/postgresql/archive
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01-ana.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ana"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  ana:
    build: .
    environment: *ana-env
    ports:
      - "${ANA_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging
    # RF-023-02: time to drain (not ready → running executions finish → stop).
    stop_grace_period: 40s

volumes:
  data:
  wal_archive:
