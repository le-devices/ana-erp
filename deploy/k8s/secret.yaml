# Fill before applying (never commit real values). Generate with:
#   openssl rand -base64 32                       → ANA_MASTER_KEY
#   openssl rand -base64 24 | tr -d '/+='         → each password
# Keep a copy of ANA_MASTER_KEY in a safe place: without it the connector secrets cannot be read.
apiVersion: v1
kind: Secret
metadata:
  name: ana-secrets
type: Opaque
stringData:
  ANA_DB_PASSWORD: "TROQUE-senha-do-usuario-ana-no-banco"
  ANA_DB_EXEC_PASSWORD: "TROQUE-gerada"
  ANA_DB_READ_PASSWORD: "TROQUE-gerada"
  ANA_ADMIN_PASSWORD: "TROQUE-senha-inicial-do-admin"
  ANA_MASTER_KEY: "TROQUE-openssl-rand-base64-32"
