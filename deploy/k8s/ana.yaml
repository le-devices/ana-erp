apiVersion: apps/v1
kind: Deployment
metadata:
  name: ana
  labels: {app: ana}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ana}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}     # updates without stopping (spec 023)
  template:
    metadata:
      labels: {app: ana}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: ana}
      containers:
        - name: ana
          image: ana-erp
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: ana-config}
            - secretRef: {name: ana-secrets}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: files, mountPath: /var/lib/ana/files}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: files
          persistentVolumeClaim: {claimName: ana-files}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
